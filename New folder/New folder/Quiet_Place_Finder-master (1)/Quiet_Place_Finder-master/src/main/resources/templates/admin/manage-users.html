<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; }
        .admin-container { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; position: fixed; height: 100vh; overflow-y: auto; }
        .sidebar-header { padding: 25px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h2 { font-size: 22px; }
        .sidebar-header p { font-size: 12px; color: #888; }
        .nav-menu { list-style: none; padding: 20px 0; }
        .nav-item { margin-bottom: 5px; }
        .nav-link { display: flex; align-items: center; padding: 12px 25px; color: #ccc; text-decoration: none; gap: 12px; }
        .nav-link:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-link.active { background: #e94560; color: white; }
        .nav-icon { font-size: 20px; width: 25px; }
        .main-content { flex: 1; margin-left: 280px; padding: 20px; }
        .top-bar { background: white; border-radius: 10px; padding: 15px 25px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .page-title { font-size: 24px; font-weight: 600; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .table-container { background: white; border-radius: 10px; padding: 20px; overflow-x: auto; }
        .search-box { width: 300px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; }
        tr:hover { background: #f5f5f5; }
        .btn { padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .btn-danger { background: #dc3545; color: white; }
        .badge-active { background: #d4edda; color: #155724; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .alert { padding: 12px 20px; border-radius: 5px; margin-bottom: 20px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Quiet Place</h2>
            <p>Admin Panel</p>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a th:href="@{/admin/dashboard}" class="nav-link"><span class="nav-icon">📊</span><span>Dashboard</span></a></li>
            <li class="nav-item"><a th:href="@{/admin/manage-users}" class="nav-link active"><span class="nav-icon">👥</span><span>Manage Users</span></a></li>
            <li class="nav-item"><a th:href="@{/admin/manage-places}" class="nav-link"><span class="nav-icon">📍</span><span>Manage Places</span></a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <h1 class="page-title">Manage Users</h1>
            <div class="admin-info">
                <span>👋 Welcome, Admin</span>
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="table-container">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search users..." onkeyup="searchTable()">
            <table id="usersTable">
                <thead>
                <tr><th>ID</th><th>Username</th><th>Email</th><th>Noise Level</th><th>Range (km)</th><th>Joined</th><th>Last Login</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.username}">john_doe</td>
                    <td th:text="${user.email}">john@example.com</td>
                    <td th:text="${user.defaultNoiseLevel != null ? user.defaultNoiseLevel : '50'}">50</td>
                    <td th:text="${user.defaultRange != null ? user.defaultRange : '5.0'}">5.0</td>
                    <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">2024-01-15</td>
                    <td th:text="${user.lastLogin != null ? #temporals.format(user.lastLogin, 'yyyy-MM-dd') : 'Never'}">Never</td>
                    <td><span class="badge-active">Active</span></td>
                    <td>
                        <form method="post" th:action="@{'/admin/users/' + ${user.id} + '/delete'}" style="display: inline;">
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${users == null or users.isEmpty()}">
                    <td colspan="9" style="text-align: center;">No users found</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function searchTable() {
        let input = document.getElementById('searchInput');
        let filter = input.value.toLowerCase();
        let table = document.getElementById('usersTable');
        let rows = table.getElementsByTagName('tr');
        for (let i = 1; i < rows.length; i++) {
            let cells = rows[i].getElementsByTagName('td');
            let found = false;
            for (let j = 0; j < cells.length - 1; j++) {
                if (cells[j] && cells[j].innerText.toLowerCase().indexOf(filter) > -1) {
                    found = true;
                    break;
                }
            }
            rows[i].style.display = found ? '' : 'none';
        }
    }
</script>
</body>
</html>
