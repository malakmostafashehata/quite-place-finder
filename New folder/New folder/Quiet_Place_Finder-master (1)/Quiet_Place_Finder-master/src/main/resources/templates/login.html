<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QuietPlace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }

        .navbar {
            background: rgba(26, 26, 46, 0.95);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 28px;
            color: #e94560;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #ccc;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: #e94560;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 2rem;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header i {
            font-size: 3rem;
            color: #e94560;
            margin-bottom: 0.5rem;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            color: #1a1a2e;
        }

        .auth-header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }

        label i {
            margin-right: 8px;
            color: #e94560;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
        }

        .role-select {
            background: white;
            cursor: pointer;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #e94560;
        }

        .btn-auth-submit {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-auth-submit:hover {
            background: #c82333;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
        }

        .auth-footer a {
            color: #e94560;
            text-decoration: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo">
        <i class="fas fa-headphones"></i>
        <h1>QuietPlace</h1>
    </div>
    
</nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div th:if="${registered}" class="success-message" th:text="${registered}"></div>
            <i class="fas fa-headphones"></i>
            <h1>Welcome Back</h1>
            <p>Login to continue your quiet journey</p>
        </div>

        <div th:if="${param.error}" class="error-message">
            <i class="fas fa-exclamation-circle"></i> Invalid email or password
        </div>
        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <form action="/login" method="post">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-user-tag"></i> Login as</label>
                <select name="role" class="role-select" required>
                    <option value="user">👤 User - Find quiet places</option>
                    <option value="admin">👑 Admin - Manage system</option>
                </select>
            </div>

            <button type="submit" class="btn-auth-submit">Login</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="/register">Sign up now</a></p>
        </div>
    </div>
</div>
</body>
</html>
